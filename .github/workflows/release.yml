# Every push to main builds the single-file exe and publishes it as a new GitHub release.
name: release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish -c Release -p:Version=1.0.${{ github.run_number }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create v1.0.${{ github.run_number }}
          bin/Release/net10.0-windows/win-x64/publish/msp-tweaker.exe
          --title "Msp Tweaker 1.0.${{ github.run_number }}"
          --target ${{ github.sha }}
          --generate-notes
